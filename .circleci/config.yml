version: 2.1

# CircleCI, beside the GitHub Actions workflow (.github/workflows/ci.yml) while both run. Same rules, see docs/AUTOMATED_TESTS.md
# "CI minutes". CircleCI has no labels and no draft state, so tools/ci_plan_circleci.sh decides from the branch and the pipeline
# parameters: main runs all suites and the pixels; another branch runs the fast suites and the pixels only when something drawn
# changed; a documentation-only change runs nothing (there is no build-android job here). "Trigger Pipeline" in CircleCI can set
# `tests` (fast, slow, all) and `pixels` for a manual run. Turn on "Auto-cancel redundant workflows" in the project settings.

parameters:
  tests:
    type: string
    default: ""
  pixels:
    type: boolean
    default: false

executors:
  godot:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    environment:
      GODOT_VERSION: 4.7.2

commands:
  plan:
    description: Decide what this job runs. Stops the job when only documentation changed. Sets TIER, PIXELS and CODE.
    steps:
      - run:
          name: Plan
          command: |
            tools/ci_plan_circleci.sh "<< pipeline.parameters.tests >>" "<< pipeline.parameters.pixels >>" | tee /tmp/plan
            . /tmp/plan
            cat /tmp/plan >> "$BASH_ENV"
            if [ "$code" != true ]; then circleci-agent step halt; fi
  install-godot:
    steps:
      - restore_cache:
          key: godot-{{ .Environment.GODOT_VERSION }}
      - run:
          name: Godot
          command: |
            if [ ! -x "$HOME/godot/godot" ]; then
              mkdir -p "$HOME/godot"
              curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
              unzip -q /tmp/godot.zip -d "$HOME/godot"
              mv "$HOME"/godot/Godot_v*_linux.x86_64 "$HOME/godot/godot"
            fi
            sudo ln -sf "$HOME/godot/godot" /usr/local/bin/godot
            godot --version
      - save_cache:
          key: godot-{{ .Environment.GODOT_VERSION }}
          paths:
            - ~/godot

jobs:
  lint:
    executor: godot
    steps:
      - checkout
      - plan
      - run: pip install "gdtoolkit==4.*"
      - run: gdlint scripts tests tools
      - run:
          name: Shell scripts
          command: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck && shellcheck tests/*.sh tools/*.sh

  test:
    # The suites of the tier on the instrumented copy, then the coverage report. The 80% rule fails the job only for the tier all.
    executor: godot
    steps:
      - checkout
      - plan
      - install-godot
      - run: pip install "gdtoolkit==4.*"
      - run:
          name: Tests and coverage
          command: |
            if [ "$tier" = all ]; then export COVERAGE_REPORT_ONLY=0; else export COVERAGE_REPORT_ONLY=1; fi
            SUITE_TIER="$tier" GODOT="$(which godot)" tools/coverage.sh build/coverage
      - run:
          name: Design tokens (CSS)
          command: python3 tools/design_tokens_css.py --check
      - run:
          name: Coverage summary
          when: always
          command: if [ -f build/coverage/summary.md ]; then cat build/coverage/summary.md; fi
      - store_artifacts:
          path: build/coverage/summary.md
      - store_artifacts:
          path: build/coverage/lcov.info

  pixels:
    executor: godot
    steps:
      - checkout
      - plan
      - run:
          name: Skip when nothing drawn changed
          command: if [ "$pixels" != true ]; then circleci-agent step halt; fi
      - install-godot
      - run:
          name: Xvfb, the software GL driver and the X libraries of Godot
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl1 \
              libxcursor1 libxinerama1 libxi6 libxrandr2 libxkbcommon0 libfontconfig1 libwayland-cursor0
      - run: godot --headless --path . --import || true
      - run:
          name: Pixels at 1920x1080
          command: |
            xvfb-run -a -s "-screen 0 1920x1080x24" godot --path . --rendering-driver opengl3 --resolution 1920x1080 \
              --script tests/pixel_render.gd -- --role=tv 2>&1 | tee pixels-1080.log
            test "${PIPESTATUS[0]}" -eq 0
      - run:
          name: Pixels at 3840x2160
          command: |
            xvfb-run -a -s "-screen 0 3840x2160x24" godot --path . --rendering-driver opengl3 --resolution 3840x2160 \
              --script tests/pixel_render.gd -- --role=tv 2>&1 | tee pixels-4k.log
            test "${PIPESTATUS[0]}" -eq 0
      - store_artifacts:
          path: pixels-1080.log
      - store_artifacts:
          path: pixels-4k.log

workflows:
  ci:
    jobs:
      - lint
      - test
      - pixels
