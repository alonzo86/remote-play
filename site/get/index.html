<p class="lead">Sababi: Remote is the controller of Sababi: TV Games.</p>
<p lang="he" dir="rtl" class="lead">הורידו את אפליקציית הטלפון של Sababi.</p>

<script src="../stores.js"></script>
<script>
// The QR code of the TV opens this page. A phone goes straight to its own store when that address is filled in.
(function () {
  var ua = navigator.userAgent || "";
  var s = window.SABABI_STORES;
  if (/android/i.test(ua) && s.play) { location.replace(s.play); }
  else if (/iPhone|iPad|iPod/i.test(ua) && s.appStore) { location.replace(s.appStore); }
})();
</script>
<noscript><p>Open the Google Play or the App Store on your phone and search for Sababi: Remote.</p></noscript>
