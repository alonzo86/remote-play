name: CI

# What runs depends on what changed and on how the run started (see docs/AUTOMATED_TESTS.md, "CI minutes"):
#  - Only documentation changed (Markdown, docs/, .claude/): nothing runs.
#  - There is no Android job: the APK export is off, and the manifest patch (tools/patch_android_manifest.sh) is tested in the job `lint`
#    by tests/ci_scripts.sh (issue #286).
#  - CI runs the UNIT suites (tests/suites.txt, tier unit) on a pull request and on a push to main. The SCENARIO suites (screens,
#    layouts, texts, flows) run on demand: a manual run ("Run workflow", tests = scenario or all) or a pull request with the label
#    `full-tests` (all suites).
#  - Coverage is always reported and never fails the run. The 80% rule is a local check (tools/coverage.sh with all suites).
#  - `pixels` runs on a push to main, when a pull request changes something that is drawn (tools/ci_changes.sh), on a manual run
#    with pixels = true and on a pull request with the label `pixels`.
#  - A draft pull request runs nothing. A newer push to the same branch cancels the run that is still going.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      tests:
        description: "Suites to run: unit, scenario or all"
        type: choice
        options: [unit, scenario, all]
        default: all
      pixels:
        description: "Run the pixel checks"
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels the run of a pull request that is still going. A run on main is never cancelled (its coverage rule counts).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: 4.7.2

jobs:
  changes:
    # Decides what the other jobs do. Takes a few seconds.
    if: github.event.pull_request.draft != true
    runs-on: [self-hosted, linux]
    outputs:
      code: ${{ steps.files.outputs.code }}
      render: ${{ steps.files.outputs.render }}
      tier: ${{ steps.pick.outputs.tier }}
      pixels: ${{ steps.pick.outputs.pixels }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: files
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) BASE="origin/${BASE_REF}" ;;
            push) BASE="$BEFORE" ;;
            *) BASE="" ;;
          esac
          tools/ci_changes.sh "$BASE" | tee -a "$GITHUB_OUTPUT"
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TESTS: ${{ inputs.tests }}
          INPUT_PIXELS: ${{ inputs.pixels }}
          RENDER: ${{ steps.files.outputs.render }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          TIER=unit
          PIXELS=false
          case "$EVENT" in
            push) PIXELS=true ;;
            workflow_dispatch) TIER="$INPUT_TESTS"; PIXELS="$INPUT_PIXELS" ;;
          esac
          case " $LABELS " in *" full-tests "*) TIER=all ;; esac
          case " $LABELS " in *" pixels "*) PIXELS=true ;; esac
          if [ "$EVENT" = pull_request ] && [ "$RENDER" = true ]; then PIXELS=true; fi
          echo "tier=${TIER}" >> "$GITHUB_OUTPUT"
          echo "pixels=${PIXELS}" >> "$GITHUB_OUTPUT"
          echo "tests: ${TIER}, pixels: ${PIXELS}"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==4.*"
      - name: gdlint
        run: gdlint scripts tests tools
      - name: Shell scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck tests/*.sh tools/*.sh
      - name: CI scripts (what runs when)
        run: tests/ci_scripts.sh

  test:
    # The headless tests (the suites of tests/suites.txt). They run on the instrumented copy of the project, so that the same run
    # gives the coverage hits for the job `coverage`. A failure here is a failed test.
    # The suites of the tier that `changes` picked run, on the instrumented copy, so the job `coverage` can always report.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, linux]
    env:
      SUITE_TIER: ${{ needs.changes.outputs.tier }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==4.*"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
      - name: Tests (instrumented for coverage)
        run: COVERAGE_STEP=run GODOT="$(which godot)" tools/coverage.sh build/coverage
      - name: Design tokens (CSS)
        run: python3 tools/design_tokens_css.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-hits
          path: |
            build/coverage/hits
            build/coverage/instrumented/coverage_manifest.json
          retention-days: 7

  coverage:
    # The line coverage of scripts/ from the hits of the job `test`. No test runs here. A failure here is a module below 80%.
    # Modules that are set aside (with a reason) are in tools/coverage/exclusions.txt.
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: coverage-hits
          path: build/coverage
      # Only reported: the CI runs unit suites, and the screen modules are covered by the scenario suites. The 80% rule is a local check.
      - name: Coverage report
        env:
          COVERAGE_REPORT_ONLY: "1"
        run: COVERAGE_STEP=report tools/coverage.sh build/coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f build/coverage/summary.md ]; then cat build/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            build/coverage/summary.md
            build/coverage/summary.json
            build/coverage/lcov.info
          retention-days: 14

  pixels:
    # The render lane: pixel checks on real frames, drawn by the software GL driver (llvmpipe) under xvfb. It is not part of
    # tests/suites.txt, it has no coverage, and no other job needs it. It runs tests/pixel_render.gd at 1920x1080 and at 3840x2160, and tests/pixel_games.gd at 1920x1080.
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.pixels == 'true'
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
      - name: Xvfb and the software GL driver
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1
      - name: Import the project
        run: godot --headless --path . --import || true
      - name: Pixels at 1920x1080
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" godot --path . --rendering-driver opengl3 --resolution 1920x1080 \
            --script tests/pixel_render.gd -- --role=tv 2>&1 | tee pixels-1080.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Pixels at 3840x2160
        run: |
          xvfb-run -a -s "-screen 0 3840x2160x24" godot --path . --rendering-driver opengl3 --resolution 3840x2160 \
            --script tests/pixel_render.gd -- --role=tv 2>&1 | tee pixels-4k.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Pixels of the games at 1920x1080
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" godot --path . --rendering-driver opengl3 --resolution 1920x1080 \
            --script tests/pixel_games.gd -- --role=tv 2>&1 | tee pixels-games.log
          test "${PIPESTATUS[0]}" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixels-log
          path: pixels-*.log
          retention-days: 7
