name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==4.*"
      - name: gdlint
        run: gdlint scripts tests tools
      - name: Shell scripts
        run: |
          sudo apt-get install -y shellcheck
          shellcheck tests/run_all.sh tools/*.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
      - name: Headless tests
        run: GODOT="$(which godot)" tests/run_all.sh

  build-android:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages (the runner image has the SDK and sdkmanager)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Godot Android settings and debug keystore
        run: |
          VERSION_DIR="${HOME}/.local/share/godot"
          mkdir -p "${HOME}/.config/godot" "${VERSION_DIR}/keystores"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "${VERSION_DIR}/keystores/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -storetype pkcs12
          cat > "${HOME}/.config/godot/editor_settings-4.7.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${VERSION_DIR}/keystores/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
      - name: Install the Android build template and patch the manifest
        run: |
          mkdir -p android/build
          unzip -q "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip" -d android/build
          touch android/build/.gdignore
          printf '%s' "${GODOT_VERSION}.stable" > android/.build_version
          tools/patch_android_manifest.sh
      # Disabled for now. Turn it on again to build and upload the APKs.
      # - name: Export the APKs
      #   run: |
      #     godot --headless --path . --import || true
      #     mkdir -p build
      #     godot --headless --path . --export-debug tv build/remote-play-tv.apk
      #     godot --headless --path . --export-debug controller build/remote-play-controller.apk
      #     ls -l build/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: build/*.apk
          retention-days: 14
