name: CI

# What runs depends on what changed and on how the run started (see docs/AUTOMATED_TESTS.md, "CI minutes"):
#  - Only documentation changed (Markdown, docs/, .claude/): only `build-android` runs.
#  - A pull request runs the FAST suites (tests/suites.txt, no tier). The SLOW suites run on a push to main, on a manual run
#    ("Run workflow", tests = slow or all) and on a pull request with the label `full-tests`.
#  - The coverage check (80% for every module) needs all suites, so it runs only when the suites of both tiers run.
#  - `pixels` runs on a push to main, when a pull request changes something that is drawn (tools/ci_changes.sh), on a manual run
#    with pixels = true and on a pull request with the label `pixels`.
#  - A draft pull request runs nothing. A newer push to the same branch cancels the run that is still going.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      tests:
        description: "Suites to run: fast, slow or all (all also runs the coverage check)"
        type: choice
        options: [fast, slow, all]
        default: all
      pixels:
        description: "Run the pixel checks"
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  changes:
    # Decides what the other jobs do. Takes a few seconds.
    if: >-
      github.event.pull_request.draft != true &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-tests' || github.event.label.name == 'pixels')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.files.outputs.code }}
      render: ${{ steps.files.outputs.render }}
      tier: ${{ steps.pick.outputs.tier }}
      pixels: ${{ steps.pick.outputs.pixels }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: files
        run: |
          case "${{ github.event_name }}" in
            pull_request) BASE="origin/${{ github.base_ref }}" ;;
            push) BASE="${{ github.event.before }}" ;;
            *) BASE="" ;;
          esac
          tools/ci_changes.sh "$BASE" | tee -a "$GITHUB_OUTPUT"
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TESTS: ${{ inputs.tests }}
          INPUT_PIXELS: ${{ inputs.pixels }}
          RENDER: ${{ steps.files.outputs.render }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          TIER=fast
          PIXELS=false
          case "$EVENT" in
            push) TIER=all; PIXELS=true ;;
            workflow_dispatch) TIER="$INPUT_TESTS"; PIXELS="$INPUT_PIXELS" ;;
          esac
          case " $LABELS " in *" full-tests "*) TIER=all ;; esac
          case " $LABELS " in *" pixels "*) PIXELS=true ;; esac
          if [ "$EVENT" = pull_request ] && [ "$RENDER" = true ]; then PIXELS=true; fi
          echo "tier=${TIER}" >> "$GITHUB_OUTPUT"
          echo "pixels=${PIXELS}" >> "$GITHUB_OUTPUT"
          echo "tests: ${TIER}, pixels: ${PIXELS}"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==4.*"
      - name: gdlint
        run: gdlint scripts tests tools
      - name: Shell scripts
        run: |
          sudo apt-get install -y shellcheck
          shellcheck tests/*.sh tools/*.sh

  test:
    # The headless tests (the suites of tests/suites.txt). They run on the instrumented copy of the project, so that the same run
    # gives the coverage hits for the job `coverage`. A failure here is a failed test.
    # The suites of the tier that `changes` picked run. Only the tier `all` is instrumented: the coverage check needs all suites,
    # so a run of one tier would fail it. A run of one tier is plain (no instrumented copy), and the job `coverage` is skipped.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUITE_TIER: ${{ needs.changes.outputs.tier }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==4.*"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
      - name: Tests (instrumented for coverage, tier all)
        if: env.SUITE_TIER == 'all'
        run: COVERAGE_STEP=run GODOT="$(which godot)" tools/coverage.sh build/coverage
      - name: Tests (tier ${{ env.SUITE_TIER }}, no coverage)
        if: env.SUITE_TIER != 'all'
        run: GODOT="$(which godot)" tests/run_suites.sh
      - name: Design tokens (CSS)
        run: python3 tools/design_tokens_css.py --check
      - uses: actions/upload-artifact@v4
        if: env.SUITE_TIER == 'all'
        with:
          name: coverage-hits
          path: |
            build/coverage/hits
            build/coverage/instrumented/coverage_manifest.json
          retention-days: 7

  coverage:
    # The line coverage of scripts/ from the hits of the job `test`. No test runs here. A failure here is a module below 80%.
    # Modules that are set aside (with a reason) are in tools/coverage/exclusions.txt.
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tier == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: coverage-hits
          path: build/coverage
      - name: Coverage and the 80% rule
        run: COVERAGE_STEP=report tools/coverage.sh build/coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f build/coverage/summary.md ]; then cat build/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            build/coverage/summary.md
            build/coverage/summary.json
            build/coverage/lcov.info
          retention-days: 14

  pixels:
    # The render lane: pixel checks on real frames, drawn by the software GL driver (llvmpipe) under xvfb. It is not part of
    # tests/suites.txt, it has no coverage, and no other job needs it. It runs tests/pixel_render.gd at 1920x1080 and at 3840x2160.
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.pixels == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
      - name: Xvfb and the software GL driver
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1
      - name: Import the project
        run: godot --headless --path . --import || true
      - name: Pixels at 1920x1080
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" godot --path . --rendering-driver opengl3 --resolution 1920x1080 \
            --script tests/pixel_render.gd -- --role=tv 2>&1 | tee pixels-1080.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Pixels at 3840x2160
        run: |
          xvfb-run -a -s "-screen 0 3840x2160x24" godot --path . --rendering-driver opengl3 --resolution 3840x2160 \
            --script tests/pixel_render.gd -- --role=tv 2>&1 | tee pixels-4k.log
          test "${PIPESTATUS[0]}" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixels-log
          path: pixels-*.log
          retention-days: 7

  build-android:
    # Runs for every change, also a change of documentation only (then lint and test are skipped, and this job still runs).
    # It does not run when a job before it failed, or when the run is a draft or a label that starts nothing.
    needs: [changes, lint, test]
    if: ${{ !cancelled() && !failure() && needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages (the runner image has the SDK and sdkmanager)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Godot Android settings and debug keystore
        run: |
          VERSION_DIR="${HOME}/.local/share/godot"
          mkdir -p "${HOME}/.config/godot" "${VERSION_DIR}/keystores"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "${VERSION_DIR}/keystores/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -storetype pkcs12
          cat > "${HOME}/.config/godot/editor_settings-4.7.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${VERSION_DIR}/keystores/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
      - name: Install the Android build template and patch the manifest
        run: |
          for DIR in android android-tv; do
            mkdir -p ${DIR}/build
            unzip -q "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip" -d ${DIR}/build
            touch ${DIR}/build/.gdignore
            printf '%s' "${GODOT_VERSION}.stable" > ${DIR}/.build_version
          done
          tools/patch_android_manifest.sh
      # Disabled for now. Turn it on again to build and upload the APKs.
      # - name: Export the APKs
      #   run: |
      #     godot --headless --path . --import || true
      #     mkdir -p build
      #     godot --headless --path . --export-debug tv build/sababi-tv.apk
      #     godot --headless --path . --export-debug controller build/sababi-controller.apk
      #     ls -l build/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: build/*.apk
          retention-days: 14
