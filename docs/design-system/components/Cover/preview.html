<!-- @dsCard height=288 -->
<style>html,body{margin:0;padding:0;background:var(--bg)}.c{width:960px;height:288px;position:relative;overflow:hidden;background:var(--bg)}
.nm{position:absolute;left:32px;bottom:28px;width:440px}.nm h1{margin:0;font:400 96px/.95 var(--font-display);color:var(--text)}.nm p{margin:12px 0 0;font:500 14px var(--font-body);color:var(--text-dim)}
svg{position:absolute;left:0;top:0}
.sh{fill:var(--shadow-ink)}.ol{stroke:var(--outline);stroke-width:6}.y{fill:var(--accent)}.k{fill:var(--room)}.b{fill:var(--button)}.d{fill:var(--bg-dark)}.cy{fill:var(--confetti-cyan)}.p1{fill:var(--player-1)}.p2{fill:var(--player-2)}.p3{fill:var(--player-3)}.p4{fill:var(--player-4)}.w{fill:var(--card)}</style>
<div class="c">
<svg width="960" height="288" viewBox="0 0 960 288">
<!-- blocks: accent 168x168 slab radius-lg, room 120x120, button 120x120 radius-pill-ish, bg-dark band, cyan 96 disc clear of the pink block. Staggered stack right of x=480.
arrangement: one tall yellow slab with satellites, hard shadow 6px offset like every Party Pop card.
pattern: discs and pills = sticker/confetti row (soft, chunky, large radii); four player-colour dots ringed in outline echo the players badge.
steps: 6px outline, 6px shadow, radii 26 and 60 (half the short side). -->
<rect class="sh" x="506" y="36" width="168" height="216" rx="26"/><rect class="y ol" x="500" y="30" width="168" height="216" rx="26"/>
<rect class="sh" x="706" y="42" width="204" height="84" rx="42"/><rect class="b ol" x="700" y="36" width="204" height="84" rx="42"/>
<circle class="p1 ol" cx="738" cy="78" r="16"/><circle class="p2 ol" cx="774" cy="78" r="16"/><circle class="p3 ol" cx="810" cy="78" r="16"/><circle class="p4 ol" cx="846" cy="78" r="16"/>
<rect class="sh" x="706" y="156" width="120" height="120" rx="26"/><rect class="k ol" x="700" y="150" width="120" height="120" rx="26"/>
<circle class="sh" cx="898" cy="222" r="48"/><circle class="cy ol" cx="892" cy="216" r="48"/>
<circle class="w ol" cx="584" cy="138" r="34"/><circle class="d" cx="584" cy="138" r="14"/>
</svg>
<div class="nm"><h1>Remote Play</h1><p>Your phone is the controller. The couch is the arcade.</p></div>
</div>
